// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        // Repositories are now managed in settings.gradle for Gradle 8+
        // Do not add google() or mavenCentral() here to avoid conflicts
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Leave allprojects block empty or remove it entirely for Gradle 8+
// repositories are handled in settings.gradle dependencyResolutionManagement

task clean(type: Delete) {
    delete rootProject.buildDir
}
