plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jamal2367.styx'
    compileSdk 34

    defaultConfig {
        applicationId "com.jamal2367.styx"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        // Add other features as needed, e.g., dataBinding true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Accompanist Permissions (Corrected version)
    implementation "com.google.accompanist:accompanist-permissions:0.32.0"

    // ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.1"

    // Room components
    implementation "androidx.room:room-runtime:2.5.0"
    annotationProcessor "androidx.room:room-compiler:2.5.0"
    // To use Kotlin annotation processing tool
    ksp "androidx.room:room-compiler:2.5.0"

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // OkHttp (Corrected version)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Data Store
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Work Manager
    implementation "androidx.work:work-runtime-ktx:2.8.1"

    // Accompanist System UI Controller (if using Compose for parts of the UI)
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.32.0"

    // Custom Tabs (for opening links externally if needed)
    implementation 'androidx.browser:browser:1.5.0'

    // Swipe Refresh (if using Compose for parts of the UI)
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    // RecyclerView
    implementation "androidx.recyclerview:recyclerview:1.3.0"

    // Fragment KTX
    implementation "androidx.fragment:fragment-ktx:1.6.0"

    // Activity KTX
    implementation "androidx.activity:activity-ktx:1.7.2"

    // Lifecycle Runtime KTX
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"

    // Hilt (if planning to use DI later)
    // implementation "com.google.dagger:hilt-android:2.44.2"
    // ksp "com.google.dagger:hilt-compiler:2.44.2"

    // Kotlin Coroutines Core
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"

    // Kotlin Coroutines Android
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"

    // Gson (often used with Retrofit)
    implementation 'com.google.code.gson:gson:2.10.1'

    // JUnit (removed the incorrect line 'androidunit:1.1.5'')
    // testImplementation 'junit:junit:4.13.2' // Already added above

    // AndroidX Test Core
    // androidTestImplementation 'androidx.test:core:1.5.0' // Not strictly necessary if using ext:junit

    // Espresso Contrib (for RecyclerView, DrawerLayout, etc.)
    // androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1' // Add if needed

    // Mockito Core (for mocking in tests)
    // testImplementation 'org.mockito:mockito-core:5.3.1' // Add if needed

    // Truth (for fluent assertions in tests)
    // testImplementation 'com.google.truth:truth:1.1.4' // Add if needed
}
