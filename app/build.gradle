// worker.js - Supreme Agent Director v2.5 (Groq + Heartbeat + Sync)
export default {
  async fetch(request, env, ctx) {
    // 1. Handle CORS for your PWA
    if (request.method === "OPTIONS") {
      return new Response(null, {
        headers: {
          "Access-Control-Allow-Origin": "*",
          "Access-Control-Allow-Methods": "POST, OPTIONS",
          "Access-Control-Allow-Headers": "Content-Type"
        }
      });
    }

    if (request.method !== "POST") {
      return new Response("Supreme Ghost Network is online.", { status: 200 });
    }

    try {
      const body = await request.json();
      const userPrompt = body.prompt;

      // 2. THE DETECTOR (Llama 3.2 1B - Switchboard)
      const detectorPrompt = `
      Analyze the user prompt and output ONLY a JSON object.
      Providers: 
      - "GITHUB": Heavy coding or logic.
      - "GEMINI": Large docs, research, file analysis.
      - "GROQ": Fast utility, math, general chat.
      - "CLOUDFLARE": Basic greetings/casual.
      Set "context_needed" to true if the prompt asks about past notes, memory, or "my vault".
      User Prompt: "${userPrompt}"
      Output: { "target": "PROVIDER_NAME", "context_needed": boolean }`;

      const detectorResponse = await env.AI.run('@cf/meta/llama-3.2-1b-instruct', {
        messages: [{ role: "user", content: detectorPrompt }]
      });

      let routingDecision;
      try {
        const cleanJson = detectorResponse.response.replace(/```json/g, "").replace(/```/g, "").trim();
        routingDecision = JSON.parse(cleanJson);
      } catch (e) {
        routingDecision = { target: "GROQ", context_needed: false };
      }

      // 3. THE VAULT (Dynamic Heartbeat Retrieval)
      let driveContext = "";
      let accessToken = "";

      if (routingDecision.context_needed) {
        try {
          accessToken = await getGoogleAccessToken(env);
          const driveRes = await fetch(`https://www.googleapis.com/drive/v3/files/${env.DRIVE_FILE_ID}?alt=media`, {
            headers: { "Authorization": `Bearer ${accessToken}` }
          });
          if (driveRes.ok) driveContext = await driveRes.text();
        } catch (err) {
          driveContext = "[Memory vault is temporarily locked]";
        }
      }

      const finalPrompt = driveContext 
        ? `[Memory Context: ${driveContext}]\n\nUser: ${userPrompt}` 
        : userPrompt;

      // 4. THE NETWORK (Routing to Experts)
      const GATEWAY_BASE = `https://gateway.ai.cloudflare.com/v1/${env.CF_ACCOUNT_ID}/${env.GATEWAY_NAME}`;
      let finalAnswer = "";

      if (routingDecision.target === "GITHUB") {
        const res = await fetch("https://models.inference.ai.azure.com/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${env.GITHUB_TOKEN}` },
          body: JSON.stringify({ model: "gpt-4o", messages: [{ role: "user", content: finalPrompt }] })
        });
        const data = await res.json();
        finalAnswer = data.choices[0].message.content;

      } else if (routingDecision.target === "GEMINI") {
        const res = await fetch(`${GATEWAY_BASE}/google-ai-studio/v1beta/models/gemini-2.0-flash:generateContent?key=${env.GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: finalPrompt }] }] })
        });
        const data = await res.json();
        finalAnswer = data.candidates[0].content.parts[0].text;

      } else if (routingDecision.target === "GROQ") {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${env.GROQ_API_KEY}` },
          body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: [{ role: "user", content: finalPrompt }] })
        });
        const data = await res.json();
        finalAnswer = data.choices[0].message.content;

      } else {
        const res = await env.AI.run('@cf/meta/llama-3.2-1b-instruct', {
          messages: [{ role: "user", content: finalPrompt }]
        });
        finalAnswer = res.response;
      }

      // 5. AUTO-SYNC (Update your .txt file in the background)
      if (routingDecision.context_needed) {
        ctx.waitUntil(saveToVault(env, accessToken, userPrompt, finalAnswer));
      }

      return new Response(JSON.stringify({ response: finalAnswer, routing: routingDecision.target }), {
        headers: { "Content-Type": "application/json", "Access-Control-Allow-Origin": "*" }
      });

    } catch (error) {
      return new Response(JSON.stringify({ error: error.message }), { status: 500, headers: { "Access-Control-Allow-Origin": "*" } });
    }
  }
};

/** * TOOLS
 */
async function getGoogleAccessToken(env) {
  const resp = await fetch("https://oauth2.googleapis.com/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      client_id: env.DRIVE_CLIENT_ID,
      client_secret: env.DRIVE_CLIENT_SECRET,
      refresh_token: env.DRIVE_REFRESH_TOKEN,
      grant_type: "refresh_token",
    })
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error("Google Auth Failed");
  return data.access_token;
}

async function saveToVault(env, token, prompt, answer) {
  if (!token) token = await getGoogleAccessToken(env);
  const currentRes = await fetch(`https://www.googleapis.com/drive/v3/files/${env.DRIVE_FILE_ID}?alt=media`, {
    headers: { "Authorization": `Bearer ${token}` }
  });
  const currentText = await currentRes.text();
  const entry = `\n\n[${new Date().toISOString()}]\nUser: ${prompt}\nAI: ${answer.substring(0, 150)}...`;
  
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${env.DRIVE_FILE_ID}?uploadType=media`, {
    method: "PATCH",
    headers: { "Authorization": `Bearer ${token}`, "Content-Type": "text/plain" },
    body: currentText + entry
  });
}
